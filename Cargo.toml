[package]
name = "sootmark-zip"
version = "0.3.1"
edition = "2021"
rust-version = "1.80"
description = "Read-only zip archives for forensic intake: zip64, stored/DEFLATE/Deflate64, WinZip AES decryption, streaming reads with CRC-32 verification. Written from scratch; cryptography from RustCrypto."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/zip"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response"]
# Sources only: test fixtures (disk images, logs, test keys) stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
common = { package = "sootmark-common", version = "0.3.6" }
# Cryptography is never written in-house (D11): RustCrypto, MIT OR Apache-2.0.
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# Key derivation (PBKDF2) is slow unoptimised; tests open many encrypted entries.
[profile.dev.package."*"]
opt-level = 3
